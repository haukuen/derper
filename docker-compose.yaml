services:
  admission-controller:
    image: ghcr.io/haukuen/derper-admission-controller:latest
    container_name: admission-controller
    restart: unless-stopped
    volumes:
      - ./whitelist.txt:/etc/derper/whitelist.txt
    # Loopback only: derper reaches the controller over the compose
    # network, and /verify is an unauthenticated allowlist oracle - never
    # publish 8081 to the public internet. The loopback binding keeps
    # `curl 127.0.0.1:8081/status` working on the host for debugging.
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    environment:
      # - TS_SYNC_CLIENTS=k1234567890abcdef:tskey-client-xxxx

  derper:
    image: ghcr.io/haukuen/derper:latest
    container_name: derper
    restart: unless-stopped
    environment:
      - DERP_HOSTNAME=<your_server_public_ip>
      - VERIFY_CLIENT_URL=http://admission-controller:8081/verify
    ports:
      - "40007:40007/tcp"
      - "40008:40008/udp"
    volumes:
      # Named volume (not a host bind mount): the container runs as a
      # non-root user and needs to write self-signed certs here on first
      # start, which a host-owned bind directory would not allow.
      - derper-certs:/var/lib/derper
    depends_on:
      admission-controller:
        condition: service_healthy

volumes:
  derper-certs:
