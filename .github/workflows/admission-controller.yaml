name: Build and Push admission-controller to GHCR

on:
  push:
    tags:
      - "controller-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag for this test build (e.g. test, v0.1.0-beta1)"
        required: false
        default: "test"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-admission-controller

# Serialize runs against the same ref (tag push + manual dispatch can
# overlap); never cancel mid-publish, queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive image tags
        id: tags
        run: |
          VERSION="dev"
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          if [[ "$GITHUB_REF" == refs/tags/controller-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/controller-v}"
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}
          $TAGS"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            # Manual test build: only the requested tag, latest stays untouched.
            VERSION="${{ inputs.tag }}"
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./admission-controller.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
