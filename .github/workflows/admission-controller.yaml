name: Build and Push admission-controller to GHCR

on:
  push:
    tags:
      - "controller-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag for this test build (e.g. test, v0.1.0-beta1)"
        required: false
        default: "test"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-admission-controller

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          if [[ "$GITHUB_REF" == refs/tags/controller-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/controller-v}"
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}
          $TAGS"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            # Manual test build: only the requested tag, latest stays untouched.
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./admission-controller.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
