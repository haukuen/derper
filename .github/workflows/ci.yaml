name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pushes to the same branch cancel the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/admission-controller

      - name: Vet
        run: go vet ./cmd/admission-controller

      - name: Test
        run: go test ./cmd/admission-controller
